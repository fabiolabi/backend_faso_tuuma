# ============================================================
#  Faso Tuuma — stack complète : API + PostgreSQL
#  Démarrage : cp env.production.example .env  (prod)  &&  docker compose up -d --build
# ============================================================

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # ---- Media / R2 ----
      MEDIA_BACKEND: ${MEDIA_BACKEND:-local}
      MEDIA_STORAGE_DIR: ${MEDIA_STORAGE_DIR:-/app/data/media}
      MEDIA_MAX_SIZE: ${MEDIA_MAX_SIZE:-5242880}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
      MEDIA_MIGRATE_LOCAL_TO_R2: ${MEDIA_MIGRATE_LOCAL_TO_R2:-false}
      R2_BUCKET: ${R2_BUCKET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_REGION: ${R2_REGION:-auto}
    volumes:
      # Conservé pour migration one-shot local→R2 et repli ; inutile une fois R2 seul.
      - ./data/media:/app/data/media
    restart: unless-stopped

volumes:
  pgdata:
