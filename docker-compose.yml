# ============================================================
#  Faso Tuuma — stack complète : API + PostgreSQL
#
#  Variables applicatives (JWT, R2, mail…) : fichier .env uniquement.
#  Après modification du .env :
#    docker compose up -d --force-recreate app
# ============================================================

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8087:8080"
    env_file:
      - .env
    environment:
      # Surcharges réseau Docker uniquement — ne pas dupliquer R2/JWT/mail ici
      # (sinon ${R2_BUCKET} vide écrase les valeurs du .env).
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/media:/app/data/media
    restart: unless-stopped

volumes:
  pgdata:
