# ============================================================
#  Faso Tuuma — configuration commune (tous profils)
#  Profil par defaut : dev. En prod : SPRING_PROFILES_ACTIVE=prod
# ============================================================
spring.application.name=artisans
spring.profiles.active=dev

# --- JPA / Hibernate ---
# Le schema provient EXCLUSIVEMENT de Flyway : Hibernate ne fait que valider.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway (migrations versionnees) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Jackson : dates en UTC ISO-8601 (jamais de timestamp numerique ni d'heure locale) ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# --- springdoc / Swagger UI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
