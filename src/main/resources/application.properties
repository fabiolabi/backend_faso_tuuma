# ============================================================
#  Faso Tuuma — configuration commune (tous profils)
#  Profil par defaut : dev. En prod : SPRING_PROFILES_ACTIVE=prod
# ============================================================
spring.application.name=artisans
spring.profiles.active=dev

# --- JPA / Hibernate ---
# Le schema provient EXCLUSIVEMENT de Flyway : Hibernate ne fait que valider.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway (migrations versionnees) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Jackson : dates en UTC ISO-8601 (jamais de timestamp numerique ni d'heure locale) ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# --- springdoc / Swagger UI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- Authentification JWT (secret jamais en dur : variable d'environnement) ---
# JWT_SECRET doit faire au moins 32 octets (256 bits) pour HMAC-SHA256.
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl-seconds=${JWT_ACCESS_TTL:900}
app.jwt.refresh-token-ttl-seconds=${JWT_REFRESH_TTL:2592000}

# --- Réinitialisation de mot de passe (code à 6 chiffres) ---
app.password-reset.code-ttl-seconds=${RESET_CODE_TTL:900}
app.mail.from=${MAIL_FROM:no-reply@fasotuuma.bf}

# --- Upload de fichiers (multipart) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Stockage des fichiers ---
# backend=local (defaut) => disque ; backend=r2 => Cloudflare R2 (API S3-compatible).
app.media.backend=${MEDIA_BACKEND:local}
app.media.storage-dir=${MEDIA_STORAGE_DIR:./data/media}
app.media.public-base-url=${MEDIA_PUBLIC_BASE_URL:}
app.media.max-file-size-bytes=${MEDIA_MAX_SIZE:5242880}
app.media.allowed-content-types=image/jpeg,image/jpg,image/png,image/webp,image/gif,image/heic,image/heif
# R2 (requis si MEDIA_BACKEND=r2)
app.media.r2.bucket=${R2_BUCKET:}
app.media.r2.endpoint=${R2_ENDPOINT:}
app.media.r2.access-key-id=${R2_ACCESS_KEY_ID:}
app.media.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
app.media.r2.region=${R2_REGION:auto}
app.media.r2.auto-create-bucket=${R2_AUTO_CREATE_BUCKET:false}
# true = copie one-shot des fichiers locaux vers R2 au démarrage (puis repasser à false).
app.media.migrate-local-to-r2=${MEDIA_MIGRATE_LOCAL_TO_R2:false}

# --- IA (Gemini) : notation automatique des prestations + recherche sémantique ---
# enabled=false (defaut) => repli heuristique sans reseau (dev/tests sans cle).
# La cle GEMINI_API_KEY ne doit JAMAIS etre commitee : elle vient de l'environnement (.env gitignore).
app.ai.enabled=${AI_ENABLED:false}
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
app.ai.gemini.chat-model=${GEMINI_CHAT_MODEL:gemini-2.0-flash}
app.ai.gemini.embedding-model=${GEMINI_EMBEDDING_MODEL:text-embedding-004}

# --- Notifications push (Firebase / FCM) ---
# enabled=false (defaut) => repli NoOp sans reseau (dev/tests sans Firebase).
# Le fichier de credentials Firebase ne doit JAMAIS etre commite : il vient de l'environnement.
app.notification.enabled=${NOTIFICATION_ENABLED:false}
app.notification.firebase.credentials-file=${FIREBASE_CREDENTIALS_FILE:}
app.notification.firebase.project-id=${FIREBASE_PROJECT_ID:}
